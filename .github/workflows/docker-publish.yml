name: Build and publish Lite Docker image
on:
  push:
    branches: [main, docker]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for native CPU
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=XGift Lite
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test automatic bootstrap, health, and restart
        run: bash deploy/docker/smoke-test.sh "$IMAGE:test"
      - name: Publish verified architecture
        run: |
          docker tag "$IMAGE:test" "$IMAGE:lite-sha-${GITHUB_SHA}-${{ matrix.arch }}"
          docker push "$IMAGE:lite-sha-${GITHUB_SHA}-${{ matrix.arch }}"
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "$image:lite" --tag "$image:lite-sha-$GITHUB_SHA" \
            "$image:lite-sha-$GITHUB_SHA-amd64" "$image:lite-sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:lite"
